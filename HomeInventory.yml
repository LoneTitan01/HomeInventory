openapi: '3.0.3'
info:
  title: Home Inventory
  description: A home inventory system for tracking all your groceries, hardware, and more.
  version: '1.0'
servers:
  - url: https://api.server.test/v1
paths:
  /inventory/{inventoryId}:
    get:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to retrieve
        required: true
        schema:
          type: string
      description: Returns all inventory items for specified inventory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - Inventory

    post:
      parameters:
      - name: inventoryName
        in: query
        description: The name of the inventory to create
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Inventory items to add
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        '201':
          description: Ok
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
      - Inventory

    put:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to update
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Inventory items to update
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
      responses:
        '200':
          description: Ok
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
        - Inventory

    delete:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
        - Inventory

  /inventory/{inventoryId}/item/{itemId}:
    get:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        description: The id of the desired item to retrieve
        required: true
        schema:
          type: string
      description: Returns a specific item from the inventory
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
      - Item

    post:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to add an item to
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Item to add to the inventory
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      tags:
        - Item

    put:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to update an item in
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        description: The id of the desired item to update
        required: true
        schema:
          type: string
      requestBody:
        required: true
        description: Item details to update in the inventory
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Ok
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
        - Item
    
    delete:
      parameters:
      - name: inventoryId
        in: path
        description: The id of the desired inventory to delete an item from
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        description: The id of the desired item to delete
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      tags:
        - Item